<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Cream Haven</title>

    <link
        rel="stylesheet"
        href="signup.css"
    >

</head>

<body>

    <main class="ch-signup-page">

        <section class="ch-signup-card">

            <!-- ==========================================
                 CARD TOP / BRAND + CONTROLS
                 ========================================== -->

            <div class="ch-card-top">

                <!-- LOGO -->
        <a href="index.html" class="brand-logo">

            <!-- Logo Image Only -->
            <img src="images/cream7.png" alt="Scoop Haven Logo">

            <!-- Logo Name -->
            <div class="brand-text">

                <h1>
                    <span>Cream</span>
                    <strong>Haven</strong>
                </h1>

                <p>ICE CREAM & MILKSHAKES</p>

            </div>

        </a>
                <!-- CONTROLS -->
                <div class="ch-card-controls">

                    <button
                        type="button"
                        class="ch-control-btn"
                        id="rtlToggle"
                        aria-label="Toggle RTL"
                        title="Toggle RTL"
                    >
                        RTL
                    </button>


                    <button
                        type="button"
                        class="ch-control-btn"
                        id="darkModeToggle"
                        aria-label="Toggle dark mode"
                        title="Toggle dark mode"
                    >

                        <!-- Moon -->
                        <svg
                            class="ch-moon-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5a8.7 8.7 0 1 0 11.2 11.2Z"
                            ></path>
                        </svg>


                        <!-- Sun -->
                        <svg
                            class="ch-sun-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                cx="12"
                                cy="12"
                                r="4"
                            ></circle>

                            <path d="M12 2v2.5"></path>
                            <path d="M12 19.5V22"></path>

                            <path d="M4.93 4.93l1.77 1.77"></path>
                            <path d="M17.3 17.3l1.77 1.77"></path>

                            <path d="M2 12h2.5"></path>
                            <path d="M19.5 12H22"></path>

                            <path d="M4.93 19.07l1.77-1.77"></path>
                            <path d="M17.3 6.7l1.77-1.77"></path>
                        </svg>

                    </button>

                </div>

            </div>


            <!-- ==========================================
                 SIGN UP INTRO
                 ========================================== -->

            <div class="ch-signup-intro">

                <h1>
                    Create Your Account
                </h1>

               
            </div>


            <!-- ==========================================
                 SIGN UP FORM
                 ========================================== -->

            <form
                id="signupForm"
                class="ch-signup-form"
                novalidate
            >

                <div class="ch-form-grid">

                    <!-- FIRST NAME -->

                    <div class="ch-form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <div class="ch-input-box">

                            <svg
                                class="ch-input-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <circle
                                    cx="12"
                                    cy="8"
                                    r="3.5"
                                ></circle>

                                <path
                                    d="M5 20a7 7 0 0 1 14 0"
                                ></path>

                            </svg>


                            <input
                                type="text"
                                id="firstName"
                                placeholder="Enter your first name"
                                autocomplete="given-name"
                            >

                        </div>

                    </div>


                    <!-- LAST NAME -->

                    <div class="ch-form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <div class="ch-input-box">

                            <svg
                                class="ch-input-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <circle
                                    cx="12"
                                    cy="8"
                                    r="3.5"
                                ></circle>

                                <path
                                    d="M5 20a7 7 0 0 1 14 0"
                                ></path>

                            </svg>


                            <input
                                type="text"
                                id="lastName"
                                placeholder="Enter your last name"
                                autocomplete="family-name"
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="ch-form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <div class="ch-input-box">

                            <svg
                                class="ch-input-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                ></rect>

                                <path
                                    d="m3 7 9 6 9-6"
                                ></path>

                            </svg>


                            <input
                                type="email"
                                id="signupEmail"
                                placeholder="Enter your email address"
                                autocomplete="email"
                            >

                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="ch-form-group">

                        <label for="phoneNumber">
                            Phone Number
                        </label>

                        <div class="ch-input-box">

                            <svg
                                class="ch-input-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M6.5 3.5h3l1.5 4-2 1.5a14 14 0 0 0 6 6l1.5-2 4 1.5v3c0 1.1-.9 2-2 2C10.49 19.5 4.5 13.51 4.5 6.5c0-1.66.9-3 2-3Z"
                                ></path>

                            </svg>


                            <input
                                type="tel"
                                id="phoneNumber"
                                placeholder="Enter your phone number"
                                autocomplete="tel"
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="ch-form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <div class="ch-input-box">

                            <svg
                                class="ch-input-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                ></path>

                            </svg>


                            <input
                                type="password"
                                id="signupPassword"
                                placeholder="Create a password"
                                autocomplete="new-password"
                            >


                            <button
                                type="button"
                                class="ch-eye-btn"
                                data-target="signupPassword"
                                aria-label="Show password"
                            >

                                <svg
                                    class="eye-open"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    ></circle>

                                </svg>


                                <svg
                                    class="eye-closed"
                                    viewBox="0 0 24 24"
                                >
                                    <path d="m3 3 18 18"></path>

                                    <path
                                        d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.8"
                                    ></path>

                                    <path
                                        d="M6.1 6.1C3.4 8 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1"
                                    ></path>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="ch-form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="ch-input-box">

                            <svg
                                class="ch-input-icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                ></path>

                            </svg>


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                            >


                            <button
                                type="button"
                                class="ch-eye-btn"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >

                                <svg
                                    class="eye-open"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    ></circle>

                                </svg>


                                <svg
                                    class="eye-closed"
                                    viewBox="0 0 24 24"
                                >
                                    <path d="m3 3 18 18"></path>

                                    <path
                                        d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.8"
                                    ></path>

                                    <path
                                        d="M6.1 6.1C3.4 8 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1"
                                    ></path>

                                </svg>

                            </button>

                        </div>

                    </div>

                </div>


                <!-- ==========================================
                     TERMS
                     ========================================== -->

                <label class="ch-terms">

                    <input
                        type="checkbox"
                        id="termsCheck"
                    >

                    <span class="ch-checkmark"></span>

                    <span>
                        I agree to the
                        <a href="terms.html">
                            Terms &amp; Conditions
                        </a>
                        and
                        <a href="privacy.html">
                            Privacy Policy
                        </a>.
                    </span>

                </label>


                <!-- ==========================================
                     CREATE ACCOUNT
                     ========================================== -->

                <button
                    type="submit"
                    class="ch-create-btn"
                >
                    Create Account
                </button>


                <!-- ==========================================
                     OR
                     ========================================== -->

                <div class="ch-divider">

                    <span></span>

                    <strong>OR</strong>

                    <span></span>

                </div>


                <!-- ==========================================
                     SOCIAL OPTIONS
                     ========================================== -->

                <div class="ch-social-row">

                    <button
                        type="button"
                        class="ch-social-btn"
                        data-provider="Google"
                    >
                        <span class="google-icon">G</span>
                        <span>Google</span>
                    </button>


                    <button
                        type="button"
                        class="ch-social-btn"
                        data-provider="Apple"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            class="apple-icon"
                        >
                            <path
                                d="M17.05 12.54c-.02-2.17 1.77-3.22 1.85-3.27a3.97 3.97 0 0 0-3.13-1.69c-1.32-.14-2.6.79-3.28.79-.69 0-1.74-.77-2.86-.75a4.21 4.21 0 0 0-3.54 2.16c-1.53 2.65-.39 6.55 1.08 8.69.73 1.05 1.58 2.22 2.71 2.18 1.1-.04 1.52-.7 2.85-.7 1.33 0 1.71.7 2.87.67 1.19-.02 1.92-1.06 2.65-2.11.84-1.22 1.19-2.4 1.21-2.46-.03-.01-2.39-.92-2.41-3.51Z"
                            ></path>

                            <path
                                d="M14.88 6.17c.6-.73 1-1.75.89-2.77-.86.04-1.91.57-2.53 1.3-.55.64-1.04 1.68-.91 2.67.97.08 1.96-.49 2.55-1.2Z"
                            ></path>
                        </svg>

                        <span>Apple</span>
                    </button>


                    <button
                        type="button"
                        class="ch-social-btn"
                        data-provider="Facebook"
                    >
                        <span class="facebook-icon">
                            f
                        </span>

                        <span>
                            Facebook
                        </span>
                    </button>

                </div>


                <!-- ==========================================
                     LOGIN LINK
                     ========================================== -->

                <div class="ch-login-link">

                    <span>
                        Already have an account?
                    </span>

                    <a href="login.html">
                        Sign In
                    </a>

                </div>

            </form>

        </section>

    </main>


    <script src="signup.js"></script>

</body>

</html>
