<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<!-- =========================================
     CREAM HAVEN LOGIN PAGE
     ========================================= -->

<section class="ch-login-page">

    <!-- =====================================
         LOGIN WRAPPER
         ===================================== -->

    <div class="ch-login-wrapper">

        <!-- =================================
             LOGIN CARD
             ================================= -->

        <div class="ch-login-card">

            <!-- =================================
                 CARD TOP CONTROLS
                 ================================= -->

            <div class="ch-card-controls">

                <!-- RTL -->
                <button
                    type="button"
                    class="ch-auth-control"
                    id="rtlToggle"
                    aria-label="Toggle RTL"
                    title="Toggle RTL">

                    <span class="ch-rtl-icon">RTL</span>

                </button>


                <!-- Dark Mode -->
                <button
                    type="button"
                    class="ch-auth-control"
                    id="darkModeToggle"
                    aria-label="Toggle dark mode"
                    title="Toggle dark mode">

                    <!-- Sun -->
                    <svg
                        class="ch-theme-icon ch-sun-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true">

                        <circle cx="12" cy="12" r="4"></circle>

                        <path d="M12 2v2.5"></path>
                        <path d="M12 19.5V22"></path>

                        <path d="M4.93 4.93l1.77 1.77"></path>
                        <path d="M17.3 17.3l1.77 1.77"></path>

                        <path d="M2 12h2.5"></path>
                        <path d="M19.5 12H22"></path>

                        <path d="M4.93 19.07l1.77-1.77"></path>
                        <path d="M17.3 6.7l1.77-1.77"></path>

                    </svg>


                    <!-- Moon -->
                    <svg
                        class="ch-theme-icon ch-moon-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true">

                        <path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5a8.7 8.7 0 1 0 11.2 11.2Z"></path>

                    </svg>

                </button>

            </div>


            <!-- =================================
                 BRAND
                 ================================= -->

            <div class="ch-login-brand">

                 <!-- LOGO -->
        <a href="index.html" class="brand-logo">

            <!-- Logo Image Only -->
            <img src="images/cream7.png" alt="Scoop Haven Logo">

            <!-- Logo Name -->
            <div class="brand-text">

                <h1>
                    <span>Cream</span>
                    <strong>Haven</strong>
                </h1>

                <p>ICE CREAM & MILKSHAKES</p>

            </div>

        </a>
            </div>


            <!-- =================================
                 LOGIN HEADING
                 ================================= -->

            <div class="ch-login-heading">

                <h1>
                    Welcome Back
                </h1>

            </div>


            <!-- =================================
                 LOGIN FORM
                 ================================= -->

            <form
                class="ch-login-form"
                id="loginForm">

                <!-- Email -->
                <div class="ch-form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <div class="ch-input-wrapper">

                        <svg
                            class="ch-input-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2">
                            </rect>

                            <path d="m3 7 9 6 9-6"></path>

                        </svg>


                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- Password -->
                <div class="ch-form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="ch-input-wrapper">

                        <svg
                            class="ch-input-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2">
                            </rect>

                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                        </svg>


                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>


                        <!-- Password Visibility -->
                        <button
                            type="button"
                            class="ch-password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                            title="Show password">

                            <!-- Open Eye -->
                            <svg
                                class="ch-eye-open"
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>


                            <!-- Closed Eye -->
                            <svg
                                class="ch-eye-closed"
                                viewBox="0 0 24 24"
                                aria-hidden="true">

                                <path d="m3 3 18 18"></path>

                                <path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.8"></path>

                                <path d="M6.1 6.1C3.4 8 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1"></path>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- =================================
                     REMEMBER / FORGOT
                     ================================= -->

                <div class="ch-login-options">

                    <label class="ch-remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="remember">

                        <span class="ch-custom-checkbox"></span>

                        <span>
                            Remember Me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="ch-forgot-link">

                        Forgot Password?

                    </a>

                </div>


                <!-- =================================
                     SIGN IN
                     ================================= -->

                <button
                    type="submit"
                    class="ch-login-btn">

                    Sign In

                </button>


                <!-- =================================
                     DIVIDER
                     ================================= -->

                <div class="ch-login-divider">

                    <span></span>

                    <strong>
                        OR
                    </strong>

                    <span></span>

                </div>


                <!-- =================================
                     SOCIAL LOGIN
                     ================================= -->

                <div class="ch-social-login">

                    <!-- Google -->
                    <button
                        type="button"
                        class="ch-social-btn"
                        aria-label="Continue with Google">

                        <svg
                            class="ch-google-logo"
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <path d="M21.35 12.23c0-.72-.06-1.25-.2-1.8H12v3.41h5.37a4.6 4.6 0 0 1-1.99 3.02v2.5h3.22c1.88-1.73 2.75-4.28 2.75-7.13Z"></path>

                            <path d="M12 21.7c2.69 0 4.95-.88 6.6-2.34l-3.22-2.5c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.12H3.08v2.58A9.97 9.97 0 0 0 12 21.7Z"></path>

                            <path d="M6.4 13.7a6 6 0 0 1 0-3.4V7.72H3.08a9.98 9.98 0 0 0 0 8.56l3.32-2.58Z"></path>

                            <path d="M12 6.18c1.47 0 2.79.5 3.83 1.49l2.87-2.87C16.94 3.2 14.68 2.3 12 2.3a9.97 9.97 0 0 0-8.92 5.42L6.4 10.3C7.19 7.94 9.4 6.18 12 6.18Z"></path>

                        </svg>

                        <span>
                            Google
                        </span>

                    </button>


                    <!-- Apple -->
                    <button
                        type="button"
                        class="ch-social-btn"
                        aria-label="Continue with Apple">

                        <svg
                            class="ch-social-icon ch-apple-logo"
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <path d="M17.05 12.54c-.02-2.17 1.77-3.22 1.85-3.27a3.97 3.97 0 0 0-3.13-1.69c-1.32-.14-2.6.79-3.28.79-.69 0-1.74-.77-2.86-.75a4.21 4.21 0 0 0-3.54 2.16c-1.53 2.65-.39 6.55 1.08 8.69.73 1.05 1.58 2.22 2.71 2.18 1.1-.04 1.52-.7 2.85-.7 1.33 0 1.71.7 2.87.67 1.19-.02 1.92-1.06 2.65-2.11.84-1.22 1.19-2.4 1.21-2.46-.03-.01-2.39-.92-2.41-3.51Z"></path>

                            <path d="M14.88 6.17c.6-.73 1-1.75.89-2.77-.86.04-1.91.57-2.53 1.3-.55.64-1.04 1.68-.91 2.67.97.08 1.96-.49 2.55-1.2Z"></path>

                        </svg>

                        <span>
                            Apple
                        </span>

                    </button>


                    <!-- Facebook -->
                    <button
                        type="button"
                        class="ch-social-btn"
                        aria-label="Continue with Facebook">

                        <svg
                            class="ch-social-icon ch-facebook-logo"
                            viewBox="0 0 24 24"
                            aria-hidden="true">

                            <path d="M14 8h3V4.5c-.52-.07-1.99-.2-3.78-.2-3.74 0-6.3 2.28-6.3 6.48v3.62H3v3.91h3.92V22h4.8v-3.69h3.95l.63-3.91h-4.58v-3.28c0-1.13.31-1.9 2.28-1.9Z"></path>

                        </svg>

                        <span>
                            Facebook
                        </span>

                    </button>

                </div>


                <!-- =================================
                     SIGN UP
                     ================================= -->

                <div class="ch-signup-row">

                    <span>
                        New to Cream Haven?
                    </span>

                    <a href="signup.html">
                        Create an Account
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>
<script src="login.js"></script>

</body>
</html>
